<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapter Quiz — DBA Library</title>
<meta name="description" content="Test yourself with a chapter quiz from the DBA Library.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-200 min-h-screen">
  <header class="border-b border-gray-800/60 px-6 py-4">
    <div class="max-w-3xl mx-auto flex items-center justify-between">
      <a href="quizzes.html" class="text-sm text-gray-400 hover:text-white transition">← All Quizzes</a>
      <a href="index.html" class="text-sm font-semibold text-blue-400 hover:text-blue-300 transition">DBA Library</a>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-6 py-10">
    <div id="loading" class="text-center text-gray-500 py-16">Loading quiz…</div>
    <div id="error" class="hidden text-center py-16">
      <p class="text-red-400 font-semibold mb-2">Quiz not found</p>
      <p class="text-gray-500 text-sm mb-6">This chapter's quiz isn't available yet.</p>
      <a href="quizzes.html" class="text-blue-400 hover:text-blue-300 text-sm">← Back to all quizzes</a>
    </div>

    <div id="quiz" class="hidden">
      <p id="q-kicker" class="text-xs uppercase tracking-widest text-blue-400 mb-2"></p>
      <h1 id="q-title" class="text-2xl font-bold text-white mb-2"></h1>
      <p class="text-gray-500 text-sm mb-8">5 questions · pick one answer each, then check your score.</p>
      <div id="questions" class="space-y-6"></div>
      <button id="submit"
        class="mt-8 w-full py-4 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl transition disabled:opacity-40 disabled:cursor-not-allowed">
        Check My Score
      </button>

      <div id="result" class="hidden mt-8 rounded-2xl border border-gray-800 bg-gray-900/60 p-6 text-center">
        <p class="text-sm text-gray-400 mb-1">Your score</p>
        <p id="score" class="text-4xl font-bold text-white mb-4"></p>
        <p id="verdict" class="text-gray-300 text-sm mb-6"></p>
        <div class="flex flex-col sm:flex-row gap-3 justify-center">
          <a id="read-chapter" href="#" class="px-6 py-3 border border-gray-700 hover:border-gray-400 text-gray-300 hover:text-white font-semibold rounded-xl text-sm transition">📖 Re-read the Chapter</a>
          <a id="next-quiz" href="#" class="px-6 py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl text-sm transition">Next Chapter Quiz →</a>
        </div>
        <button id="retry" class="mt-4 text-sm text-gray-500 hover:text-gray-300 transition">Try again</button>
      </div>
    </div>
  </main>

  <footer class="border-t border-gray-800/50 px-6 py-8 mt-12">
    <div class="max-w-3xl mx-auto text-xs text-gray-600 text-center">© 2026 Rajesh Guntupalli · DBA Library Quizzes</div>
  </footer>

<script>
const BOOKS = {
  book1: { dir: 'book',  name: 'The DBA Handbook' },
  book2: { dir: 'book2', name: 'The AI-Powered DBA' },
  book3: { dir: 'book3', name: 'The Autonomous Database Engineer' },
  book4: { dir: 'book4', name: 'Vector Databases & AI' },
  book5: { dir: 'book5', name: 'The Cloud Database Engineer' },
  book6: { dir: 'book6', name: 'AI-Native Apps on SQL Server' },
  book7: { dir: 'book7', name: 'Database FinOps' }
};
const pad = n => String(n).padStart(2, '0');
const params = new URLSearchParams(location.search);
const bookKey = params.get('book');
const ch = parseInt(params.get('ch'), 10);
const book = BOOKS[bookKey];

let quizData = null;
let manifestLen = 0;

async function init() {
  if (!book || !ch || ch < 1) return showError();
  try {
    const [qRes, mRes] = await Promise.all([
      fetch(`quizzes/${bookKey}/ch${pad(ch)}.json`),
      fetch(`${book.dir}/manifest.json`)
    ]);
    if (!qRes.ok) return showError();
    quizData = await qRes.json();
    const manifest = await mRes.json();
    manifestLen = manifest.length;
    render();
  } catch (e) { showError(); }
}

function showError() {
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('error').classList.remove('hidden');
}

function render() {
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  document.getElementById('q-kicker').textContent = `${book.name} · Chapter ${ch} of ${manifestLen}`;
  document.getElementById('q-title').textContent = `Quiz: ${quizData.title}`;

  const wrap = document.getElementById('questions');
  wrap.innerHTML = '';
  quizData.questions.forEach((q, qi) => {
    const card = document.createElement('div');
    card.className = 'rounded-2xl border border-gray-800 bg-gray-900/40 p-5';
    card.id = `qcard-${qi}`;
    card.innerHTML = `
      <p class="font-semibold text-white mb-4"><span class="text-blue-400 mr-2">${qi + 1}.</span>${q.q}</p>
      <div class="space-y-2">
        ${q.options.map((opt, oi) => `
          <label class="opt flex items-start gap-3 px-4 py-3 rounded-xl border border-gray-800 hover:border-blue-500/60 cursor-pointer transition text-sm" data-qi="${qi}" data-oi="${oi}">
            <input type="radio" name="q${qi}" value="${oi}" class="mt-1 accent-blue-500">
            <span>${opt}</span>
          </label>`).join('')}
      </div>
      <p class="explain hidden mt-4 text-sm rounded-xl px-4 py-3"></p>`;
    wrap.appendChild(card);
  });

  const chapterFile = quizData.chapterFile;
  document.getElementById('read-chapter').href = `${book.dir}/${chapterFile}`;
  const nextBtn = document.getElementById('next-quiz');
  if (ch < manifestLen) {
    nextBtn.href = `quiz.html?book=${bookKey}&ch=${ch + 1}`;
  } else {
    nextBtn.textContent = '← All Quizzes';
    nextBtn.href = 'quizzes.html';
  }
  document.getElementById('submit').onclick = grade;
  document.getElementById('retry').onclick = () => location.reload();
}

function grade() {
  let score = 0;
  let answered = 0;
  quizData.questions.forEach((q, qi) => {
    const sel = document.querySelector(`input[name="q${qi}"]:checked`);
    const card = document.getElementById(`qcard-${qi}`);
    const explain = card.querySelector('.explain');
    const labels = card.querySelectorAll('.opt');
    labels.forEach((lb, oi) => {
      lb.classList.remove('hover:border-blue-500/60', 'cursor-pointer');
      lb.style.cursor = 'default';
      lb.querySelector('input').disabled = true;
      if (oi === q.answer) {
        lb.classList.add('border-emerald-500/70', 'bg-emerald-950/30');
      }
    });
    if (sel) {
      answered++;
      const chosen = parseInt(sel.value, 10);
      if (chosen === q.answer) {
        score++;
      } else {
        labels[chosen].classList.add('border-red-500/70', 'bg-red-950/30');
      }
    } else {
      explain.textContent = 'You skipped this one. ';
    }
    explain.textContent += q.explain ? `💡 ${q.explain}` : '';
    explain.classList.remove('hidden');
    explain.classList.add('bg-gray-800/60', 'text-gray-300');
  });

  if (answered < quizData.questions.length) {
    alert(`Answer all ${quizData.questions.length} questions first — ${quizData.questions.length - answered} left.`);
    return;
  }

  document.getElementById('submit').disabled = true;
  const pct = Math.round(score / quizData.questions.length * 100);
  document.getElementById('score').textContent = `${score} / ${quizData.questions.length}`;
  document.getElementById('verdict').textContent =
    pct === 100 ? 'Perfect — you own this chapter. 🏆' :
    pct >= 80  ? 'Strong. A quick re-read of the misses and you\'re solid.' :
    pct >= 60  ? 'Getting there — review the explanations above.' :
                 'Worth re-reading the chapter, then try again.';
  document.getElementById('result').classList.remove('hidden');
  document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

init();
</script>
</body>
</html>
