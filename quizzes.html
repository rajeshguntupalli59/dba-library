<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapter Quizzes — DBA Library</title>
<meta name="description" content="Test yourself on every chapter of all 7 DBA Library books. 250 quizzes, free, no signup.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-200 min-h-screen">
  <header class="border-b border-gray-800/60 px-6 py-4">
    <div class="max-w-5xl mx-auto flex items-center justify-between">
      <a href="index.html" class="text-sm text-gray-400 hover:text-white transition">← DBA Library</a>
      <span class="text-sm font-semibold text-blue-400">Chapter Quizzes</span>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-6 py-12">
    <h1 class="text-3xl font-bold text-white mb-3">📝 Chapter Quizzes</h1>
    <p class="text-gray-400 mb-10 max-w-2xl">Every chapter, quizzed. 5 questions each, drawn straight from the chapter — instant scoring with explanations. Pick a book, pick a chapter, prove you know it.</p>
    <div id="books" class="space-y-10">
      <p class="text-gray-500">Loading quizzes…</p>
    </div>
  </main>

  <footer class="border-t border-gray-800/50 px-6 py-8 mt-12">
    <div class="max-w-5xl mx-auto text-xs text-gray-600 text-center">© 2026 Rajesh Guntupalli · DBA Library Quizzes</div>
  </footer>

<script>
const BOOKS = [
  { key: 'book1', dir: 'book',  name: 'The DBA Handbook',                  color: 'blue' },
  { key: 'book2', dir: 'book2', name: 'The AI-Powered DBA',               color: 'violet' },
  { key: 'book3', dir: 'book3', name: 'The Autonomous Database Engineer', color: 'emerald' },
  { key: 'book4', dir: 'book4', name: 'Vector Databases & AI',            color: 'cyan' },
  { key: 'book5', dir: 'book5', name: 'The Cloud Database Engineer',      color: 'orange' },
  { key: 'book6', dir: 'book6', name: 'AI-Native Apps on SQL Server',     color: 'rose' },
  { key: 'book7', dir: 'book7', name: 'Database FinOps',                  color: 'amber' }
];
const COLORS = {
  blue: 'border-blue-900/40', violet: 'border-violet-900/40', emerald: 'border-emerald-900/40',
  cyan: 'border-cyan-900/40', orange: 'border-orange-900/40', rose: 'border-rose-900/40', amber: 'border-amber-900/40'
};

async function init() {
  const wrap = document.getElementById('books');
  wrap.innerHTML = '';
  for (const b of BOOKS) {
    let chapters = [];
    try {
      const res = await fetch(`${b.dir}/manifest.json`);
      chapters = await res.json();
    } catch (e) { continue; }
    const section = document.createElement('section');
    section.id = `book-${b.key.replace('book', '')}`;
    section.className = `rounded-3xl border ${COLORS[b.color]} bg-gray-900/30 p-6 scroll-mt-20`;
    section.innerHTML = `
      <div class="flex items-baseline justify-between mb-5">
        <h2 class="text-xl font-bold text-white">${b.name}</h2>
        <span class="text-xs text-gray-500">${chapters.length} quizzes</span>
      </div>
      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2">
        ${chapters.map((c, i) => `
          <a href="quiz.html?book=${b.key}&ch=${i + 1}"
             class="px-3 py-2.5 rounded-xl border border-gray-800 hover:border-blue-500/60 bg-gray-950/60 hover:bg-gray-900 transition text-left">
            <span class="block text-[11px] text-gray-500">Ch ${i + 1}</span>
            <span class="block text-xs text-gray-200 truncate" title="${c.title}">${c.title}</span>
          </a>`).join('')}
      </div>`;
    wrap.appendChild(section);
  }
  if (location.hash) {
    const el = document.querySelector(location.hash);
    if (el) el.scrollIntoView();
  }
}
init();
</script>
</body>
</html>
